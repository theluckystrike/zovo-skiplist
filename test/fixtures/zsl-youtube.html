<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>QA SkipList Fixture</title>
    <style>
      body { font: 16px system-ui; margin: 24px; background: #f5f7fb; color: #172033; }
      #movie_player { position: relative; width: 720px; height: 405px; background: #111827; border-radius: 16px; }
      video { display: block; width: 100%; height: 100%; }
      .ytp-right-controls { position: absolute; right: 12px; bottom: 16px; display: flex; gap: 8px; }
      .ytp-progress-bar-container { position: absolute; left: 0; right: 0; bottom: 0; height: 8px; background: #38445a; }
      button { margin: 14px 8px 0 0; padding: 8px 12px; }
      output { display: block; margin-top: 18px; font-family: ui-monospace, monospace; }
    </style>
  </head>
  <body>
    <h1 id="qa-title">QA SkipList Fixture</h1>
    <div id="movie_player" class="html5-video-player">
      <div class="html5-video-container"><video id="qa-video" muted></video></div>
      <div class="ytp-progress-bar-container"><div class="ytp-progress-bar"></div></div>
      <div class="ytp-right-controls"></div>
    </div>
    <button id="qa-set-a">Set A (0.40)</button>
    <button id="qa-set-b">Set B (1.20)</button>
    <button id="qa-play">Play</button>
    <button id="qa-replay">Replay</button>
    <button id="qa-near-outro">Near outro</button>
    <output id="qa-video-state">initializing</output>
    <div id="qa-settled" hidden></div>
    <script>
      (() => {
        const params = new URLSearchParams(location.search);
        const videoId = (params.get("v") || "qaSkip00001").slice(0, 11);
        const qaCase = params.get("case") || "bookmark";
        const titles = {
          podcast: "QA Podcast Episode 42",
          near: "QA Podcastery Episode 42",
          invalid: "QA podcast fallback",
          boundary: "QA Podcast Episode 420",
        };
        const title = titles[qaCase] || "QA SkipList Fixture";
        document.title = title;
        document.querySelector("#qa-title").textContent = title;

        const video = document.querySelector("#qa-video");
        const player = document.querySelector("#movie_player");
        const state = document.querySelector("#qa-video-state");
        let current = 0;
        let paused = true;
        let timer = null;
        let jumps = 0;
        let maxForwardJump = 0;
        let last = 0;

        const setCurrent = (value, external = false) => {
          const next = Math.max(0, Math.min(3, Number(value) || 0));
          const delta = next - current;
          if (!external && delta > 0.15) {
            jumps += 1;
            maxForwardJump = Math.max(maxForwardJump, delta);
          }
          last = current;
          current = next;
          video.dispatchEvent(new Event("seeking"));
          video.dispatchEvent(new Event("timeupdate"));
          video.dispatchEvent(new Event("seeked"));
        };

        Object.defineProperties(video, {
          currentTime: { configurable: true, get: () => current, set: (value) => setCurrent(value) },
          duration: { configurable: true, get: () => 3 },
          readyState: { configurable: true, get: () => 4 },
          paused: { configurable: true, get: () => paused },
          ended: { configurable: true, get: () => current >= 3 },
        });
        video.play = async () => {
          paused = false;
          video.dispatchEvent(new Event("play"));
          video.dispatchEvent(new Event("playing"));
          clearInterval(timer);
          timer = setInterval(() => {
            if (paused) return;
            last = current;
            current = Math.min(3, current + 0.05);
            video.dispatchEvent(new Event("timeupdate"));
            if (current >= 3) {
              paused = true;
              clearInterval(timer);
              video.dispatchEvent(new Event("ended"));
            }
          }, 50);
        };
        video.pause = () => { paused = true; clearInterval(timer); video.dispatchEvent(new Event("pause")); };

        const details = {
          videoId,
          title,
          author: "QA Fixture",
          channelId: "UCqaFixture00000000000000",
          shortDescription: qaCase === "podcast" ? "A deterministic podcast fixture" : "A deterministic fixture",
          lengthSeconds: "3",
        };
        player.getVideoData = () => ({
          video_id: videoId,
          title,
          author: details.author,
          channel_id: details.channelId,
        });
        player.getPlayerResponse = () => ({ videoDetails: details });
        player.getCurrentTime = () => current;
        player.getDuration = () => 3;
        player.getPlayerState = () => paused ? 2 : 1;
        window.ytInitialPlayerResponse = { videoDetails: details };

        document.querySelector("#qa-set-a").onclick = () => setCurrent(0.4, true);
        document.querySelector("#qa-set-b").onclick = () => setCurrent(1.2, true);
        document.querySelector("#qa-play").onclick = () => { setCurrent(0.25, true); void video.play(); };
        document.querySelector("#qa-replay").onclick = () => { setCurrent(0.25, true); void video.play(); };
        document.querySelector("#qa-near-outro").onclick = () => { setCurrent(2.35, true); void video.play(); };

        setInterval(() => {
          const notices = document.querySelectorAll(".sponsorSkipNotice").length;
          state.textContent = [
            `id=${videoId}`,
            `case=${qaCase}`,
            `t=${current.toFixed(2)}`,
            `last=${last.toFixed(2)}`,
            `jumps=${jumps}`,
            `maxJump=${maxForwardJump.toFixed(2)}`,
            `paused=${paused}`,
            `notices=${notices}`,
          ].join(";");
        }, 50);

        video.dispatchEvent(new Event("loadedmetadata"));
        video.dispatchEvent(new Event("loadeddata"));
        video.dispatchEvent(new Event("canplay"));
        setTimeout(() => { document.querySelector("#qa-settled").hidden = false; }, 2500);
      })();
    </script>
  </body>
</html>
